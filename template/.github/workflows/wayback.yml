name: Wayback preservation

# Weekly Internet Archive preservation of every reference URL in
# data/chronology.json. Runs scripts/archive-refs.js (availability lookup +
# polite Save Page Now for unarchived URLs), rebuilds the site so the
# "archived" fallback links render, and commits data/archives.json + docs/
# when anything changed.
#
# Template file — projects copy it (with scripts/archive-refs.js) verbatim.
#
# Why CI and not a local sandbox (fsp ADR-0006): this must be able to run on
# GitHub-hosted runners so that when a development sandbox blocks archive.org,
# the pipeline still runs here — never route around an egress policy.

on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC (off the top of the hour)
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch the deploy workflow below. Without it the rebuilt docs/
  # sit on main and never reach a reader (see the step's comment).
  actions: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Archive reference URLs
        run: node scripts/archive-refs.js

      - name: Rebuild site (archive fallback links come from data/archives.json)
        run: node build.js

      - name: Commit updated archives
        id: commit
        run: |
          if git diff --quiet -- data/archives.json docs/; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives.json docs/
          git commit -m "Wayback: refresh data/archives.json (scheduled preservation run)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does NOT trigger other workflows: GitHub
      # suppresses it so automation cannot set off recursive runs. So the push
      # above rebuilt docs/ on main and deploy.yml never woke up, and every
      # weekly run left the SITE one commit behind its own repository -- for
      # months, invisibly, while this job and the deploy both reported success.
      # Nineteen of twenty-five sites were stale when published-drift.py was
      # finally run with --grace 0 (core#98).
      #
      # An explicit API dispatch with the same token IS allowed -- the
      # restriction is on implicit event triggering, not on asking. So ask.
      - name: Deploy the rebuilt site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy.yml dispatched for $GITHUB_REPOSITORY"

